name: .NET Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore dependencies
        run: dotnet restore progressa.slnx

      - name: Build solution
        run: dotnet build progressa.slnx --no-restore

      - name: Run unit tests
        run: dotnet test Progressa.Tests/Progressa.Tests.csproj --no-build
